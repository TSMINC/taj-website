<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        />
        <style>
          :root {
            --bg-deep: #0d0f1a;
            --bg-panel: rgba(255, 255, 255, 0.06);
            --bg-panel-strong: rgba(255, 255, 255, 0.1);
            --ink: #f2f0eb;
            --ink-muted: rgba(242, 240, 235, 0.68);
            --ink-faint: rgba(242, 240, 235, 0.42);
            --accent: #8ea3e8;
            --hairline: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.5);
          }
          body {
            margin: 0;
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
            color: var(--ink);
          }
          a {
            color: var(--accent);
          }
          a:hover {
            color: #b3c3ef;
          }
          .artboard {
            width: 1440px;
            height: 900px;
            background: var(--bg-deep);
            display: flex;
            overflow: hidden;
            position: relative;
          }
          .aurora {
            position: absolute;
            inset: 0;
            background:
              radial-gradient(
                ellipse 60% 40% at 20% 30%,
                rgba(140, 100, 200, 0.32),
                transparent 60%
              ),
              radial-gradient(
                ellipse 50% 40% at 80% 70%,
                rgba(80, 140, 200, 0.28),
                transparent 60%
              ),
              radial-gradient(
                ellipse 40% 30% at 60% 15%,
                rgba(180, 100, 160, 0.18),
                transparent 60%
              );
            filter: blur(30px);
            pointer-events: none;
          }

          /* SINGLE collapsed sidebar — icons only. Hovering (in the real app)
     expands it into a labeled panel. This mockup shows the stowed/
     default state only, per the reference. */
          .sidebar {
            width: 76px;
            background: var(--bg-panel);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-right: 1px solid var(--hairline);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            z-index: 3;
            box-shadow: var(--glass-inner);
          }
          .logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), #5b6fc5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-deep);
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 36px;
          }
          .side-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-muted);
            margin-bottom: 6px;
            cursor: pointer;
          }
          .side-icon:hover {
            color: var(--ink);
            background: var(--bg-panel-strong);
          }
          .side-icon.active {
            color: var(--ink);
            background: var(--bg-panel-strong);
            border: 1px solid var(--glass-border);
          }
          .side-icon svg {
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .side-hint {
            margin-top: auto;
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-faint);
            writing-mode: vertical-rl;
            padding-bottom: 8px;
            font-weight: 600;
          }

          .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
          }
          .topbar {
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--hairline);
          }
          .search-wrap {
            position: relative;
          }
          .search-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-faint);
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            width: 15px;
            height: 15px;
          }
          .search {
            padding: 11px 18px 11px 42px;
            border-radius: 12px;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--hairline);
            color: var(--ink-muted);
            font-size: 13px;
            width: 340px;
          }
          .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
          }
          .top-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--hairline);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-muted);
            cursor: pointer;
          }
          .top-btn svg {
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
          }
          .profile-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #5b6fc5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-deep);
            font-weight: 700;
            font-size: 13px;
            border: 2px solid var(--glass-border);
            cursor: pointer;
          }

          .content {
            flex: 1;
            padding: 44px 44px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 28px;
            overflow: hidden;
          }
          .greeting {
            grid-column: 1 / -1;
            margin-bottom: 4px;
          }
          .greeting-eyebrow {
            font-size: 11.5px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-faint);
            margin-bottom: 10px;
            font-weight: 600;
          }
          .greeting h1 {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 44px;
            font-weight: 400;
            letter-spacing: -0.015em;
            margin: 0;
          }
          .greeting h1 em {
            font-style: italic;
            color: var(--accent);
          }

          .primary-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 30px;
            box-shadow: var(--glass-inner), var(--glass-shadow);
            display: flex;
            flex-direction: column;
            gap: 22px;
          }
          .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--ink-muted);
          }
          .panel-title {
            font-weight: 600;
            color: var(--ink);
            font-size: 14px;
          }
          .card-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
          }
          .mini-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--hairline);
            border-radius: 16px;
            padding: 20px;
          }
          .mini-card-label {
            font-size: 11px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin-bottom: 6px;
            font-weight: 600;
          }
          .mini-card-val {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 32px;
            font-weight: 400;
            color: var(--ink);
          }

          .side-rail {
            display: flex;
            flex-direction: column;
            gap: 16px;
          }
          .rail-card {
            background: var(--bg-panel);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 24px;
            box-shadow: var(--glass-inner), var(--glass-shadow);
          }
          .rail-card-title {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 22px;
            margin: 0 0 6px;
          }
          .rail-card-sub {
            font-size: 12px;
            color: var(--ink-muted);
            margin: 0 0 16px;
          }
          .rail-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
          }
          .rail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--ink-muted);
          }
          .rail-item .check {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-deep);
            flex-shrink: 0;
          }
          .rail-item .check svg {
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
          }
        </style>
      </helmet>
      <div class="artboard">
        <div class="aurora"></div>

        <!-- SINGLE sidebar, stowed / icons-only (default state). Hover expands. -->
        <div class="sidebar">
          <div class="logo">T</div>
          <div class="side-icon active" title="Home">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M3 12l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" />
            </svg>
          </div>
          <div class="side-icon" title="Projects">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M3 10h18" />
            </svg>
          </div>
          <div class="side-icon" title="AI Systems">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 2v3M12 19v3M22 12h-3M5 12H2M18.4 5.6l-2.1 2.1M7.8 16.2l-2.1 2.1M18.4 18.4l-2.1-2.1M7.8 7.8 5.7 5.7"
              />
            </svg>
          </div>
          <div class="side-icon" title="Files">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6" />
            </svg>
          </div>
          <div class="side-icon" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </div>
          <div class="side-hint">Hover to expand</div>
        </div>

        <div class="main">
          <div class="topbar">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <div class="search">Search...</div>
            </div>
            <div class="top-actions">
              <div class="top-btn">
                <svg width="16" height="16" viewBox="0 0 24 24">
                  <path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8Z" />
                  <path d="M10 20a2 2 0 0 0 4 0" />
                </svg>
              </div>
              <div class="profile-circle">TM</div>
            </div>
          </div>

          <div class="content">
            <div class="greeting">
              <div class="greeting-eyebrow">Welcome back</div>
              <h1>Good <em>evening</em>, [name].</h1>
            </div>

            <div class="primary-panel">
              <div class="panel-head">
                <div class="panel-title">Active projects</div>
                <div>Last 30 days</div>
              </div>
              <div class="card-grid">
                <div class="mini-card">
                  <div class="mini-card-label">In flight</div>
                  <div class="mini-card-val">[N]</div>
                </div>
                <div class="mini-card">
                  <div class="mini-card-label">Shipped</div>
                  <div class="mini-card-val">[N]</div>
                </div>
                <div class="mini-card">
                  <div class="mini-card-label">Revenue</div>
                  <div class="mini-card-val">[$]</div>
                </div>
              </div>
            </div>

            <div class="side-rail">
              <div class="rail-card">
                <h3 class="rail-card-title">Today</h3>
                <p class="rail-card-sub">Next actions</p>
                <div class="rail-list">
                  <div class="rail-item">
                    <span class="check"
                      ><svg width="10" height="10" viewBox="0 0 24 24">
                        <path d="m5 12 5 5L20 7" /></svg
                    ></span>
                    [Task]
                  </div>
                  <div class="rail-item">
                    <span class="check"
                      ><svg width="10" height="10" viewBox="0 0 24 24">
                        <path d="m5 12 5 5L20 7" /></svg
                    ></span>
                    [Task]
                  </div>
                  <div class="rail-item">
                    <span class="check"
                      ><svg width="10" height="10" viewBox="0 0 24 24">
                        <path d="m5 12 5 5L20 7" /></svg
                    ></span>
                    [Task]
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
  </body>
</html>
