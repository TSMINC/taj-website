<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
<style>
  :root {
    --bg: #0d0f1a;
    --ink: #f2f0eb;
    --ink-muted: rgba(242, 240, 235, 0.68);
    --ink-faint: rgba(242, 240, 235, 0.42);
    --accent: #8ea3e8;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.2);
    --glass-shadow: 0 32px 80px -18px rgba(0, 0, 0, 0.6), 0 6px 20px -6px rgba(0, 0, 0, 0.35);
  }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); }
  a { color: var(--accent); } a:hover { color: #b3c3ef; }
  .artboard {
    width: 1440px;
    height: 900px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .aurora {
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 18%, rgba(140, 100, 220, 0.45), transparent 60%),
      radial-gradient(ellipse 50% 45% at 12% 78%, rgba(230, 100, 160, 0.38), transparent 60%),
      radial-gradient(ellipse 50% 45% at 88% 78%, rgba(80, 190, 220, 0.35), transparent 60%);
    filter: blur(40px);
  }

  .pill-nav {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 -1px 0 rgba(0, 0, 0, 0.2),
      0 12px 32px -8px rgba(0, 0, 0, 0.5),
      0 2px 6px -1px rgba(0, 0, 0, 0.3);
  }
  .pill-brand { padding: 8px 18px 8px 14px; font-family: 'Instrument Serif', Georgia, serif; font-size: 18px; letter-spacing: -0.01em; color: var(--ink); border-right: 1px solid rgba(255, 255, 255, 0.12); margin-right: 4px; }
  .pill-link { padding: 10px 22px; border-radius: 999px; color: var(--ink-muted); text-decoration: none; font-size: 13.5px; font-weight: 500; }
  .pill-link:hover { color: var(--ink); background: rgba(255, 255, 255, 0.14); }
  .pill-link.active { color: var(--ink); background: rgba(255, 255, 255, 0.14); }
  .pill-signin { padding: 10px 20px; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; font-size: 13px; font-weight: 600; margin-left: 6px; }

  .content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 120px 64px 40px;
    position: relative;
    z-index: 2;
  }
  .contact-shell {
    background: var(--glass-bg);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 32px;
    padding: 60px 64px;
    max-width: 720px;
    width: 100%;
    box-shadow: var(--glass-inner), var(--glass-shadow);
  }
  .contact-eyebrow {
    font-size: 11.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 16px;
    text-align: center;
  }
  .contact-shell h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 40px;
    text-align: center;
  }
  .contact-shell h1 em { font-style: italic; color: var(--accent); }

  .field-list { display: flex; flex-direction: column; gap: 20px; }
  .field {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 24px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.14),
      inset 0 -1px 0 rgba(0, 0, 0, 0.15),
      0 4px 12px -2px rgba(0, 0, 0, 0.35);
  }
  .field-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    flex-shrink: 0;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 2px 6px -1px rgba(0, 0, 0, 0.35);
  }
  .field-icon svg { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .field-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .field-value {
    font-size: 14px;
    color: var(--ink-faint);
    font-style: italic;
  }

  .footer-strip { padding: 24px 40px; display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 12px; position: relative; z-index: 2; }
</style>
</helmet>
<div class="artboard">
  <div class="aurora"></div>

  <nav class="pill-nav">
    <div class="pill-brand">[Your brand]</div>
    <a class="pill-link" href="#">Home</a>
    <a class="pill-link" href="#">Products</a>
    <a class="pill-link" href="#">Services</a>
    <a class="pill-link active" href="#">Contact</a>
    <a class="pill-signin" href="#">Sign in</a>
  </nav>

  <div class="content">
    <div class="contact-shell">
      <div class="contact-eyebrow">Get in touch</div>
      <h1>Let's build <em>something</em>.</h1>

      <div class="field-list">
        <div class="field">
          <div class="field-icon">
            <svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          </div>
          <div>
            <div class="field-label">Email</div>
            <div class="field-value">(to be added)</div>
          </div>
        </div>

        <div class="field">
          <div class="field-icon">
            <svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4"/></svg>
          </div>
          <div>
            <div class="field-label">LinkedIn</div>
            <div class="field-value">(to be added)</div>
          </div>
        </div>

        <div class="field">
          <div class="field-icon">
            <svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <div>
            <div class="field-label">Book a call</div>
            <div class="field-value">(to be added)</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-strip">
    <div>Template — fill in via <code>src/site.config.ts</code></div>
    <div>[YEAR] &nbsp;·&nbsp; [Your brand]</div>
  </div>
</div>
</x-dc>
</body>
</html>
