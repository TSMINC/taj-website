<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
<style>
  :root {
    --bg: #eef1f7;
    --ink: #131316;
    --ink-muted: #55555c;
    --ink-faint: #9a9aa2;
    --accent: #4a5fc5;
    /* Glass on light bg needs MORE opacity + TWO shadows + rim lighting.
       See ~/.claude/skills/visual-depth-and-lighting for why. */
    --glass-bg: rgba(255, 255, 255, 0.45);
    --glass-bg-strong: rgba(255, 255, 255, 0.65);
    --glass-inner: inset 0 1px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 0 rgba(30, 40, 90, 0.05);
    --glass-shadow: 0 32px 80px -18px rgba(50, 65, 140, 0.28), 0 6px 20px -6px rgba(50, 65, 140, 0.14);
  }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); }
  a { color: var(--accent); } a:hover { color: #3a4bb0; }
  .artboard {
    width: 1440px;
    height: 900px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  /* Aurora mesh — SATURATED colors so blur has real content to distort.
     Pastels + white bg = flat. Vivid + white bg = depth (verified). */
  .aurora {
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 45% 35% at 12% 20%, rgba(80, 120, 255, 0.55), transparent 55%),
      radial-gradient(ellipse 40% 35% at 88% 30%, rgba(255, 100, 160, 0.5), transparent 55%),
      radial-gradient(ellipse 50% 40% at 70% 88%, rgba(80, 220, 200, 0.5), transparent 55%),
      radial-gradient(ellipse 40% 35% at 22% 92%, rgba(180, 100, 240, 0.5), transparent 55%);
    filter: blur(30px);
  }

  /* Floating pill nav — center-top */
  .pill-nav {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 0 rgba(30, 40, 90, 0.06),
      0 8px 24px -6px rgba(50, 65, 140, 0.22),
      0 2px 6px -1px rgba(50, 65, 140, 0.14);
  }
  .pill-brand {
    padding: 8px 18px 8px 14px;
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 18px;
    letter-spacing: -0.01em;
    color: var(--ink);
    border-right: 1px solid rgba(19, 19, 22, 0.08);
    margin-right: 4px;
  }
  .pill-link {
    padding: 10px 22px;
    border-radius: 999px;
    color: var(--ink-muted);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .pill-link:hover { color: var(--ink); background: rgba(255, 255, 255, 0.55); }
  .pill-link.active { color: var(--ink); background: rgba(255, 255, 255, 0.55); }
  .pill-link.hover-demo {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.55);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    position: relative;
  }
  .pill-link.hover-demo::after {
    content: 'hover state ↑';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 8px;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
    white-space: nowrap;
  }
  .pill-signin {
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    margin-left: 6px;
  }

  .hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 64px;
    position: relative;
    z-index: 2;
  }
  .hero-card {
    background: var(--glass-bg);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 36px;
    padding: 88px 96px;
    max-width: 920px;
    text-align: center;
    box-shadow: var(--glass-inner), var(--glass-shadow);
  }
  .hero-eyebrow {
    font-size: 11.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 24px;
    font-weight: 600;
  }
  .hero h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 84px;
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin: 0 0 28px;
    color: var(--ink);
  }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .hero p {
    font-size: 18px;
    line-height: 1.55;
    color: var(--ink-muted);
    margin: 0 auto 40px;
    max-width: 540px;
  }
  .cta-row { display: flex; gap: 12px; justify-content: center; }
  .btn-primary {
    padding: 15px 32px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-secondary {
    padding: 15px 32px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -1px 0 rgba(30, 40, 90, 0.08),
      0 4px 12px -2px rgba(50, 65, 140, 0.15);
  }

  .footer-strip {
    padding: 28px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--ink-faint);
    font-size: 12px;
    position: relative;
    z-index: 2;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #4bb37a; display: inline-block; margin-right: 8px; vertical-align: middle; box-shadow: 0 0 6px rgba(75, 179, 122, 0.6); }
</style>
</helmet>
<div class="artboard">
  <div class="aurora"></div>

  <nav class="pill-nav">
    <div class="pill-brand">[Your brand]</div>
    <a class="pill-link active" href="#">Home</a>
    <a class="pill-link hover-demo" href="#">Services</a>
    <a class="pill-link" href="#">Contact</a>
    <a class="pill-signin" href="#">Sign in</a>
  </nav>

  <div class="hero">
    <div class="hero-card">
      <div class="hero-eyebrow">Custom AI &nbsp;·&nbsp; Custom software</div>
      <h1>Systems that <em>ship</em>, not demos.</h1>
      <p>Local and hybrid AI systems, agent architectures, and modern web software — delivered as running code you own.</p>
      <div class="cta-row">
        <a class="btn-primary" href="#">Start a project</a>
        <a class="btn-secondary" href="#">See services</a>
      </div>
    </div>
  </div>

  <div class="footer-strip">
    <div><span class="dot"></span>Available for new projects</div>
    <div>[YEAR] &nbsp;·&nbsp; [Your brand]</div>
  </div>
</div>
</x-dc>
</body>
</html>
